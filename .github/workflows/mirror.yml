name: Mirror ptxdist repository

on:
  schedule:
    - cron: '0 2 * * *'   # every night at 02:00 UTC
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-keyscan git.pengutronix.de >> ~/.ssh/known_hosts

      - name: Clone upstream mirror
        run: |
          git clone --mirror \
            git://git.pengutronix.de/ptxdist ptxdist.git

      - name: Push to GitHub mirror
        run: |
          cd ptxdist.git
          git remote set-url origin git@github.com:https://github.com/rac-mar-vys/ptxdist-mirror
          git push --mirror
